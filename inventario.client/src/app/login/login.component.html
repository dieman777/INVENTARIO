<div class="row justify-content-center">
  <div class="col-4">

    <h2>Ingreso al modulo</h2>

    <form (ngSubmit)="loginUsuario()">

      <div class="mb-3">
        <label for="fusuario" class="form-label">
          Usuario
        </label>

        <input type="text"
               id="fusuario"
               class="form-control"
               [(ngModel)]="UsuariosLoginRequest.usuario"
               name="usuario" />
      </div>

      <div class="mb-3">
        <label for="fpasword" class="form-label">
          Contraseña
        </label>

        <input type="password"
               id="fpasword"
               class="form-control"
               [(ngModel)]="UsuariosLoginRequest.contrasena"
               name="contrasena" />
      </div>

      <button type="submit" class="btn btn-primary">
        Ingresar
      </button>

    </form>

    <div *ngIf="mensaje" class="alert alert-info mt-3">
      {{ mensaje }}
    </div>

  </div>
</div>
